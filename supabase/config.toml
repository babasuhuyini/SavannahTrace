# Supabase CLI configuration for local development (`supabase start`).
# Hosted-project settings (Auth providers, redirect URLs, SMTP) are configured in
# the Supabase Dashboard — see docs/SUPABASE_SETUP.md. No secrets in this file.

project_id = "savannah-trace"

[api]
enabled = true
port = 54321
# Only `public` is exposed through the Data API. The `private` schema (authorization
# helpers) is deliberately NOT listed.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
# Hosted test site (GitHub Pages). Change both when trace.savannahfruits.com goes live.
site_url = "https://babasuhuyini.github.io/SavannahTrace/"
additional_redirect_urls = ["https://babasuhuyini.github.io/SavannahTrace/**", "http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Invitation only: nobody can create an account by themselves. IT issues a one-time
# invitation link (admin-users Edge Function); the person then sets their own password.
enable_signup = false
enable_anonymous_sign_ins = false
# Password policy, enforced by Supabase Auth on the server (the app checks more on top:
# common/guessable passwords, name/email in the password, known data breaches).
minimum_password_length = 12
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 10
# Password sign-in attempts per 5 minutes per IP address (slows password guessing).
sign_in_sign_ups = 30
# Code / link verifications per 5 minutes per IP (authenticator codes, one-time links).
token_verifications = 30

[auth.email]
# Email + password sign-in. Sign-ups stay off via [auth] enable_signup.
enabled = true
double_confirm_changes = true
enable_confirmations = true
# Changing a password needs a recent sign-in. The app re-checks the current password
# and the authenticator code before every change, which satisfies this.
secure_password_change = true
otp_length = 6
# Lifetime of one-time invitation and password-reset links (24 hours, single use).
otp_expiry = 86400
max_frequency = "60s"

# Authenticator-app MFA (TOTP: Microsoft Authenticator, Google Authenticator, …).
# Mandatory: the database refuses all data until the session has passed this step (aal2).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# NOTE: Supabase blocks template changes on Free projects until custom SMTP is set
# (docs/SUPABASE_SETUP.md §4). After SMTP is configured, uncomment the sections below
# and run `npx supabase config push`.
# Branded templates. Their links open the app's own confirmation page, which needs a
# click before the one-time token is used, so email security scanners (e.g. Microsoft
# Safe Links) that pre-open links cannot use up an invitation.
# [auth.email.template.invite]
# subject = "You have been invited to Savannah Trace"
# content_path = "./supabase/templates/invite.html"

# [auth.email.template.recovery]
# subject = "Reset your Savannah Trace password"
# content_path = "./supabase/templates/recovery.html"

[auth.external.google]
enabled = false # set true once the Google Cloud OAuth client exists
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.public-trace]
verify_jwt = false # anonymous customers; token is validated inside the function

[functions.trace-link]
verify_jwt = true

[functions.admin-users]
verify_jwt = true
