name: Deploy to GitHub Pages

# Builds the app and publishes it to https://<owner>.github.io/<repo>/ on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The site connects to the Savannah Trace Supabase project (LIVE mode). To publish the
# fictional DEMO instead, add the repository variable LIVE_MODE = false (Settings →
# Secrets and variables → Actions → Variables) and re-run this workflow.
# Only browser-safe values belong here — never the secret/service-role key.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Browser-safe values (they are visible in the built site anyway). Repository
          # variables of the same name override them; set LIVE_MODE=false to build the demo.
          VITE_SUPABASE_URL: ${{ vars.LIVE_MODE != 'false' && (vars.VITE_SUPABASE_URL || 'https://xinbkypxnegzokpohazz.supabase.co') || '' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LIVE_MODE != 'false' && (vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_34jCgQEwD15rAik87v2LIQ_qHzY8DsV') || '' }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://babasuhuyini.github.io/SavannahTrace/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
